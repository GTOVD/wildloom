# Sample procedural instances — NOT loaded by runtime; authoring / tests only.
#
# Numbering (why ints vs ratios):
#   - stats.*  → same family: effective combat budget units (UI often integers; resolver may use floats after buffs).
#   - affinity_emphasis.* → weights on a simplex (each in [0,1], together sum to 1) for Layer 1 emphasis / typing display.
#   - material_profile.*  → normalized material axes in [0,1] for Layers 2–3 (different meaning than stat budgets).
#
# Catalog primary/secondary on a dex row are flavor-only; here they mirror how UI might *collapse* emphasis to two chips.

