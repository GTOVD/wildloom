# -----------------------------------------------------------------------------
# Resolved Blast (surge_blast) — four player-built variants (regenerated)
# -----------------------------------------------------------------------------
# NOT loaded by runtime today: authoring / fixtures / UI mocks only.
#
# Frame + numeric bands:
#   data/moves/attack_templates.catalog.json → template_id: surge_blast
#
# Naming (docs/ATTACK-CATALOG.md — Dynamic display names & nicknames):
#   • system_display_title is authored here as the expected composer output until
#     move_display_composer.rules.json ships; ordering is illustrative.
#   • Frame-only title requires: null affinity, ω within modality prominence dead-zone
#     (~uniform ⅓³), no status assignments, impulses at 0 (or below composer floor).
#   • player_label is commentary only.
#
# damage_outcome_partition: explicit shares (COMBAT-MODEL §3.1); surge_blast defaults
#   to full endurance on these fixtures — no utility_field / utility_pressure on surge.
# -----------------------------------------------------------------------------

meta:
  template_id: surge_blast
  frame_display_name: Blast
  category: surge
  damage_kind_default: endurance
  docs:
    - ../../docs/ATTACK-CATALOG.md
    - ../../docs/COMBAT-MODEL.md
  notes:
    - Status IDs are PLACEHOLDER_* until status_catalog + composer tokens exist.
    - system_display_title strings are fixture targets for the title composer.
    - Values sit inside surge_blast customization bands (catalog schema_version 1.1.0).

cross_variant_axes:
  columns:
    - variant_key
    - system_display_title
    - elemental_identity
    - base_power
    - cooldown_turns
    - pierce
    - delivery_notes
    - status_count
    - modality_tokens
  rows:
    - variant_key: bare_blast
      system_display_title: Blast
      elemental_identity: none
      base_power: 45
      cooldown_turns: 1
      pierce: 0.08
      delivery_notes: uniform ω — no modality adjective
      status_count: 0
      modality_tokens: ""
    - variant_key: thermal_piercing_burn
      system_display_title: Burning Piercing Thermal Blast
      elemental_identity: thermal mono
      base_power: 82
      cooldown_turns: 3
      pierce: 0.22
      delivery_notes: pierce-skew ω — Piercing token
      status_count: 1
      modality_tokens: Piercing
    - variant_key: storm_surge_fusion
      system_display_title: Primed Conductive Galvanic–Aqueous Blast
      elemental_identity: galvanic + aqueous (η=0.28)
      base_power: 64
      cooldown_turns: 2
      pierce: 0.14
      delivery_notes: near-uniform ω — no modality adjective
      status_count: 2
      modality_tokens: ""
    - variant_key: vitriol_glass_push
      system_display_title: Rupturing Slashing Corrosive Blast
      elemental_identity: corrosive mono
      base_power: 108
      cooldown_turns: 5
      pierce: 0.38
      delivery_notes: slash-skew ω — Slashing token
      status_count: 2
      modality_tokens: Slashing

